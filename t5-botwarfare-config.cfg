// Limit server slots to actual player count to reduce memory pressure on map rotation
seta sv_maxclients "18"

// Bot Warfare default settings
seta bots_manage_fill 16
seta bots_manage_fill_mode 0
seta bots_manage_fill_kick false
seta bots_skill 0
seta bots_loadout_rank 0
seta bots_loadout_prestige -2
